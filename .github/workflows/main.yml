name: Automated JioTV 
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Configure Git User
        run: |
          git config --global user.name "Babuperumana"
          git config --global user.email "babuperumana@gmail.com"
          
      - name: Sync and Update Log
        run: |
          export TZ="Asia/Kolkata"
          git pull origin main --rebase
          curl -sS -L -o jtv.m3u "https://mute-sunset-8225.streamstar18.workers.dev/"
          echo "🚀 JIOTV  Synced | IST: $(date +'%Y-%m-%d %H:%M:%S')"
          
      - name: Commit and Push
        run: |
          export TZ="Asia/Kolkata"
          git add jtv.m3u 
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "JIOTV Updated ✅ [$(date +'%d-%m-%Y %H:%M')]"
          git push origin main
